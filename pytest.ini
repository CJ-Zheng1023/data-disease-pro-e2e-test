# ============================================================================
# pytest 全局配置
# ============================================================================
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 将项目根目录加入 sys.path，保证 config/src 包可被导入
pythonpath = .

# 默认命令行参数：
#   -v                    输出详细用例信息
#   --strict-markers      未注册的 marker 直接报错，防止拼写错误
#   --tb=short            失败时输出精简堆栈
#   --alluredir           Allure 原始结果目录
#   --clean-alluredir     每次运行前清理上次结果
# 常用覆盖方式：
#   pytest --headed          以有头模式运行（观察浏览器操作过程）
#   pytest --slowmo=500      放慢操作速度，便于人工排查
#   pytest -m smoke          只运行冒烟用例
addopts =
    -v
    --strict-markers
    --tb=short
    --alluredir=allure-results
    --clean-alluredir

# 自定义 marker 注册（--strict-markers 要求）
markers =
    smoke: 冒烟用例（核心链路，快速反馈）
    no_auth: 该用例不使用已保存的登录态（登录、退出、修改密码等场景自行登录）
    data_cleanup: 涉及测试数据创建与清理的用例

# 日志：控制台实时输出 + 文件落盘（文件日志在 src/common/logger.py 中配置）
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
